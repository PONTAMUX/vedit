<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>修正点 - V-edit</title>
<link rel="icon" href="/static/icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="rvwin">
<section id="review" class="panel"></section>
<script>window.TOKEN = "__TOKEN__";</script>
<script src="/static/review.js"></script>
<script>
// 別窓: 位置は編集画面から BroadcastChannel で受け取り、クリックは編集画面へシークを送る
let last = null, lastAt = 0;
const ch = Review.chan;
ch.onmessage = e => {
  const m = e.data;
  if (m.type === "pos") { last = m; lastAt = performance.now(); }
  else if (m.type === "saved") Review.refresh();
  else if (m.type === "bye") window.close();
};
Review.mount(document.getElementById("review"), {
  docked: false,
  pos: () => last && performance.now() - lastAt < 1500 ? last : null,
  seek: (src, gapAt) => ch.postMessage({ type: "seek", src, gapAt }),
});
ch.postMessage({ type: "hello" });
addEventListener("beforeunload", () => ch.postMessage({ type: "closed" }));
</script>
</body>
</html>
